<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">

  <title>Frontend Mentor | QR code component</title>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

</head>

<body class="flex justify-center items-center bg-slate-300 font-outfit">

  <main class="flex w-full h-screen justify-center items-center">
    <div class="flex flex-col max-w-[320px] justify-center items-center m-10 rounded-2xl bg-white p-5">
      <img class="rounded-xl" src="images/image-qr-code.png" alt="">
      <h1 class="text-[24px] text-balance font-bold  text-slate-900 py-4">
        Improve your front-end skills by building projects
      </h1>
      <p class="text-pretty text-slate-500">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
      </p>

    </div>
  </main>

    Desafio do <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Desenvolvido por <a href="#">Samuel Abreu</a>.
  </footer> -->
</body>

</html>
